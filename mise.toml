# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
node = "26.13.1"
pnpm = "12.21.0"
"github:Goldziher/poly" = "0.36.0"
lychee = "0.24.2"

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]

[tasks."docs:lint:links"]
description = "Check internal links with lychee (root-relative links resolve against the Starlight content root)"
# openapi-viewer.html is a static asset in docs-site/public, outside the content root lychee resolves against. ~keep
run = '''lychee --offline --include-fragments --root-dir "$PWD/docs-site/src/content/docs" --fallback-extensions md,mdx --exclude 'openapi-viewer\.html$' docs-site/src/content/docs README.md'''

[tasks."docs:lint:prose"]
description = "Lint prose with textlint"
run = "pnpm --dir docs-site exec textlint 'src/content/docs/**/*.{md,mdx}'"

[tasks."docs:lint:public"]
description = "Fail when published content references private sources, customers or internal infrastructure"
run = "bash scripts/check-public-content.sh"

[tasks."docs:check"]
description = "Build the site and run every documentation gate"
depends = ["docs:build"]
run = [{ task = "docs:lint:public" }, { task = "docs:lint:links" }, { task = "docs:lint:prose" }]
